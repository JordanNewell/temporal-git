<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/favicon-32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ '/favicon-512.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/apple-touch-icon.png' | relative_url }}">
  <link rel="shortcut icon" href="{{ '/favicon.ico' | relative_url }}">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0A0A">



<title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <meta name="generator" content="Jekyll v{{ jekyll.version }}">

  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:image" content="{{ '/assets/img/social-preview.png' | absolute_url }}">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <a href="#content" class="skip-link">Skip to content</a>

  <header class="site-header">
    <div class="header-inner">
      <a href="{{ '/' | relative_url }}" class="brand">
        <img src="{{ '/assets/img/logo-mark.png' | relative_url }}" alt="" class="brand-mark" width="40" height="40">
        <span class="brand-text">TEMPORAL<span class="brand-accent">GIT</span></span>
      </a>
      <nav class="site-nav">
        <a href="https://github.com/JordanNewell/temporal-git">Source</a>
        <a href="https://github.com/JordanNewell/temporal-git/releases">Releases</a>
        <a href="https://www.npmjs.com/package/temporal-git">npm</a>
      </nav>
    </div>
  </header>

  <main id="content" class="main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <img src="{{ '/assets/img/logo-mark.png' | relative_url }}" alt="" class="footer-mark" width="24" height="24">
        <span>TEMPORAL<span class="brand-accent">GIT</span></span>
      </div>
      <div class="footer-meta">
        <span class="sep">·</span>
        <a href="https://github.com/JordanNewell/temporal-git/blob/master/LICENSE">MIT</a>
        <span class="sep">·</span>
        <a href="https://github.com/JordanNewell/temporal-git">GitHub</a>
        <span class="sep">·</span>
        <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      </div>
    </div>
  </footer>
<!--
  NEWELL Universal Footer — drop-in component.
  Paste before </body> on any page. Self-contained: inline CSS + SVG, no deps.
-->
<footer class="newell-footer">
  <a href="https://jordannewell.com" class="newell-footer-link" aria-label="A NEWELL project — visit jordannewell.com" title="A NEWELL project">
    <svg class="newell-footer-mark" viewBox="0 0 48 48" width="24" height="24" aria-hidden="true">
      <rect x="2" y="2" width="44" height="44" rx="6" fill="#0A0A0A" stroke="#00FF41" stroke-width="1.5"/>
      <rect x="6" y="6" width="36" height="36" rx="3" fill="#0A0A0A" stroke="#1F1F1F" stroke-width="0.5"/>
      <path d="M 14 14 L 14 34 L 17 34 L 17 19 L 14 16 Z" fill="#FFFFFF"/>
      <path d="M 31 34 L 31 31 L 17 14 L 14 14 L 14 17 L 28 34 Z" fill="#FFFFFF"/>
      <path d="M 34 14 L 31 14 L 31 31 L 34 28 L 34 14 Z" fill="#FFFFFF"/>
    </svg>
    <span class="newell-footer-text">
      <span class="newell-footer-project">A NEWELL project</span>
      <span class="newell-footer-sep">·</span>
      <span class="newell-footer-credit">Built by Jordan Newell</span>
    </span>
  </a>
</footer>

<style>
  .newell-footer {
    border-top: 1px solid #1F1F1F;
    background: #0A0A0A;
    padding: 14px 24px;
    font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
    font-size: 12px;
    letter-spacing: 0.04em;
    color: #A0A0A0;
    margin-top: auto;
  }
  .newell-footer-link {
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: inherit;
    max-width: 1200px;
    margin: 0 auto;
    transition: color 0.15s ease;
  }
  .newell-footer-link:hover {
    color: #00FF41;
  }
  .newell-footer-mark {
    flex-shrink: 0;
    display: block;
  }
  .newell-footer-text {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .newell-footer-project {
    color: #FFFFFF;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-size: 11px;
  }
  .newell-footer-sep {
    color: #1F1F1F;
  }
  .newell-footer-credit {
    color: #A0A0A0;
  }
  .newell-footer-link:hover .newell-footer-project {
    color: #00FF41;
  }
  @media (max-width: 600px) {
    .newell-footer {
      padding: 12px 16px;
      font-size: 11px;
    }
    .newell-footer-link {
      gap: 8px;
    }
    .newell-footer-mark {
      width: 20px;
      height: 20px;
    }
  }
</style>

</body>
</html>
